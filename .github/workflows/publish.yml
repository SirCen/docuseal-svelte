name: Publish
on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24

            # The npm bundled with the Node version above is not guaranteed
            # to be new enough for trusted publishing or `npm stage`.
            - run: npm install -g npm@latest

            - run: npm ci

            - name: Check the trusted publishing preconditions
              run: |
                  npm --version
                  if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
                    echo "OIDC token endpoint is available"
                  else
                    echo "OIDC token endpoint is MISSING - id-token: write was not granted"
                    exit 1
                  fi

            - run: npm test

            - name: Create Release Pull Request
              id: changesets
              uses: changesets/action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Staging uploads the tarball but does not release it. Approve or
            # reject it from the npm website, or with `npm stage approve <id>`.
            - name: Stage the release for manual approval
              if: steps.changesets.outputs.hasChangesets == 'false'
              run: |
                  package=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")
                  if npm view "$package@$version" version > /dev/null 2>&1; then
                    echo "$package@$version is already published, nothing to stage"
                    exit 0
                  fi
                  npm run release

            # npm swallows every trusted publishing failure and falls back to
            # an unauthenticated request, so the reason only ever appears as a
            # verbose "oidc" line in the debug log. Only those lines are
            # printed, to keep credentials out of the job output.
            - name: Explain the trusted publishing failure
              if: failure()
              run: |
                  for log in "$HOME"/.npm/_logs/*-debug-0.log; do
                    if grep -qiE "oidc|token exchange" "$log"; then
                      echo "===== $log ====="
                      grep -iE "oidc|token exchange" "$log"
                    fi
                  done
