name: Publish
on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # Trusted publishing needs npm 11.5.1 or newer, which is not
            # guaranteed by the npm bundled with the Node version above.
            - run: npm install -g npm@latest

            - run: npm ci

            - name: Check the trusted publishing preconditions
              run: |
                  npm --version
                  if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
                    echo "OIDC token endpoint is available"
                  else
                    echo "OIDC token endpoint is MISSING - id-token: write was not granted"
                    exit 1
                  fi

            - run: npm test

            - name: Create Release Pull Request or Publish
              uses: changesets/action@v1
              with:
                  publish: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
