name: Publish
on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # Trusted publishing needs npm 11.5.1 or newer, which is not
            # guaranteed by the npm bundled with the Node version above.
            - run: npm install -g npm@latest

            - run: npm ci

            - name: Check the trusted publishing preconditions
              run: |
                  npm --version
                  if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
                    echo "OIDC token endpoint is available"
                  else
                    echo "OIDC token endpoint is MISSING - id-token: write was not granted"
                    exit 1
                  fi

            - run: npm test

            - name: Create Release Pull Request or Publish
              uses: changesets/action@v1
              with:
                  publish: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # npm swallows every trusted publishing failure and falls back to
            # an unauthenticated publish, so the reason only ever appears as a
            # verbose "oidc" line in the debug log. Only those lines are
            # printed, to keep credentials out of the job output.
            - name: Explain the trusted publishing failure
              if: failure()
              run: |
                  for log in "$HOME"/.npm/_logs/*-debug-0.log; do
                    if grep -qiE "oidc|token exchange" "$log"; then
                      echo "===== $log ====="
                      grep -iE "oidc|token exchange" "$log"
                    fi
                  done
